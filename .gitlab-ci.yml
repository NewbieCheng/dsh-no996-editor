stages:
  - publish

# Tag push → publish @newbiecheng/dsh-openfilm to this project's npm Package Registry.
# Set CI/CD variable NPM_TOKEN (masked) to a PAT/project token with `api` (or package write).
publish:package:
  stage: publish
  image: node:22
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - node --version
    - npm ci
    - export npm_config_userconfig="$(mktemp)"
    - trap 'rm -f "$npm_config_userconfig"' EXIT
    - printf '@newbiecheng:registry=https://gitlab.com/api/v4/projects/89041706/packages/npm/\n' > "$npm_config_userconfig"
    - printf '//gitlab.com/api/v4/projects/89041706/packages/npm/:_authToken=%s\n' "$NPM_TOKEN" >> "$npm_config_userconfig"
    - npm run release:check
    - node scripts/pack-tgz.mjs
    - export PACKAGE_VERSION="$(node -p "require('./package.json').version")"
    - npm publish "dist/newbiecheng-dsh-openfilm-${PACKAGE_VERSION}.tgz" --access public --registry https://gitlab.com/api/v4/projects/89041706/packages/npm/

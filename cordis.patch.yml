- insert:
    - id: no996-editor
      name: '@newbiecheng/dsh-no996-editor'
    # OpenFilm's editing session: a whitelist, not a denylist. Only the plugins below are mounted, so
    # only their tools exist for the agent — anything else (codegraph, subagents, goals, Office, image
    # generation) is absent by construction. Third-party tools are deliberately not mentioned here at
    # all: someone else installing a plugin must never collide with this preset.
    #
    # Reading is the point (read/read_image/glob/grep), editing goes through edit/write or the
    # openfilm_* tools, and running is pwsh/bash for the bundled OpenFilm CLI (plus openfilm_cli for
    # doctor/look/render without a shell). web_search/web_fetch stay: references are part of the work.
    - id: preset-openfilm-video-editing
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: openfilm-video-editing
        name: No996 Studio 剪辑与动效
        description: 根据素材和目标剪辑影片，制作动效并验证成片。
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: "你是 No996 Studio 的剪辑与动效搭档。用用户的语言沟通。把需求变成清楚、耐看、能播放的影片；需要时用代码制作和调整画面。只问会改变结果的关键问题，如实区分方案、预览和成片。"
          - id: openfilm-video-prompt
            name: '@newbiecheng/dsh-no996-editor/openfilm-prompt'
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
              projectRootMarkers:
                - .git
                - .film
                - film.html
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          # Native film sessions use this preset. The Host owns the skill registry;
          # this scoped provider registers only the package's film skills. Default
          # user roots are excluded and the filesystem provider does not watch them.
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              includeDefaultRoots: false
              watch: false
          - id: openfilm-video-skills
            name: '@newbiecheng/dsh-no996-editor/openfilm-skills'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            # Required by 0.2.2; omitting it breaks the whole preset.
            config:
              sampleOverCapGlobResults: false

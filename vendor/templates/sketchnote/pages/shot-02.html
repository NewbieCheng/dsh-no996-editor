<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080, height=1920">
<title>02 · 选一个概念</title>
<link rel="stylesheet" href="../assets/sketch.css">
<script src="../assets/motion.js"></script>
</head>
<body>

  <main class="sketch-page portrait">
    <header class="sketch-header"><span data-element-id="sketch-series" class="series">费曼笔记</span><span data-element-id="sketch-page-label">No.07 · 学习方法</span></header>
    <div class="sketch-progress" aria-label="学习步骤"><span data-step="1" class="done">1</span><span data-step="2" class="">2</span><span data-step="3" class="">3</span><span data-step="4" class="">4</span></div>
    
    <div class="sketch-copy"><p data-element-id="sketch-kicker" class="eyebrow">第 1 步</p>
      <h1 data-element-id="sketch-headline" class="display">选一个概念</h1>
      <p data-element-id="sketch-deck" class="deck">比如：</p></div>
    <div class="sketch-step-card " data-element-id="sketch-step-card">
      <span class="tape" data-composite-group="decorative-tape"></span>
      <b data-element-id="sketch-step-number" class="step-number">1</b>
      <h2 data-element-id="sketch-step-title" class="step-title">选一个概念</h2>
      <p data-element-id="sketch-step-note" class="step-note">什么是复利？</p>
      
    </div>
    <svg data-element-id="sketch-arrow-2" class="sketch-arrow vertical" viewBox="0 0 240 90" aria-hidden="true">
    <path d="M8 55C62 18 139 18 218 43M194 19l25 24-33 19" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
    <footer class="sketch-footer"><span data-element-id="sketch-footer">讲给外行听</span></footer>
  </main>
<script>
(function () {
    const duration = 2.744;
    const title = document.querySelector('[data-reveal]') || document.querySelector('.display');
    const card = document.querySelector('[data-element-id="sketch-step-card"], [data-element-id="sketch-title-diagram"], [data-element-id="sketch-summary"], [data-element-id="sketch-loop-diagram"]');
    const arrow = document.querySelector('.sketch-arrow path');
    function draw(value) {
      const t = Math.max(0, Math.min(duration, Number(value) || 0));
      const p = window.Motion.cubicOut(Math.min(1, t / 0.48));
      if (title) { title.style.clipPath = 'inset(0 ' + ((1 - p) * 100) + '% 0 0)'; }
      if (card) { card.style.opacity = String(p); card.style.transform = 'translateY(' + ((1 - p) * 22) + 'px)'; }
      if (arrow) { arrow.style.opacity = String(p); arrow.style.strokeDashoffset = String(420 * (1 - p)); }
    }
    window.film = { width: 1080, height: 1920, duration,
      ready: Promise.resolve(document.fonts?.ready).then(function () { draw(0); return true; }),
      frame: draw };
  })();
</script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, height=1920">
  <title>行动清单 · 打卡波纹</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0a0c10; }
    canvas#stage { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <canvas id="stage" width="1080" height="1920"></canvas>
  <script src="../assets/motion.js"></script>
  <script src="../assets/vibe-canvas.js"></script>
  <script>
    (function () {
      'use strict';
      const SHOT = {"id":"shot-07","title":"行动清单 · 打卡波纹","chapter":"06 · 立刻开始","series":"VIBE 知识大赏","brand":"不加班智能团","duration":5,"filmDuration":42,"start":32.5,"bpm":112,"palette":{},"copy":{"headline":"今天就做这 3 件事","items":[{"title":"先找一扇双向门","sub":"可撤销、能重来的事，别原地内耗"},{"title":"把计划切成两周块","sub":"写死止损线，只验证最小关键问题"},{"title":"先用草稿/沙盘跑一遍","sub":"零成本暴露坑位，再投入真时间"}]},"vars":{}};
      const canvas = document.getElementById('stage');
      const stage = window.VibeKit.createStage(canvas, { width: 1080, height: 1920, palette: SHOT.palette });
      const rhythm = window.VibeKit.readRhythm(SHOT.filmDuration, SHOT.bpm);

      function drawShot({ t, duration, ctx, w, h, safe, pal, copy, kit }) {
  kit.drawRiseText(ctx, copy.headline || '今天就做这 3 件事', safe.cx, 380, 68, t, 0.15, {
    al: 'center',
    w: 900,
    col: pal.ACC,
  });

  const items = Array.isArray(copy.items) ? copy.items : [
    { title: '先找一扇双向门', sub: '可撤销、能重来的事，别原地内耗' },
    { title: '把计划切成两周块', sub: '写死止损线，只验证最小关键问题' },
    { title: '先用草稿/沙盘跑一遍', sub: '零成本暴露坑位，再投入真时间' },
  ];

  items.forEach((item, idx) => {
    const enterStart = 0.4 + idx * 0.28;
    const doneStart = 1.2 + idx * 0.85;
    kit.drawChecklistRow(ctx, {
      palette: pal,
      x: safe.left,
      y: 510 + idx * 280,
      width: safe.span,
      height: 220,
      num: idx + 1,
      title: item.title,
      sub: item.sub,
      enter: kit.P(t, enterStart, enterStart + 0.55),
      done: kit.P(t, doneStart, doneStart + 0.45),
      ripple: kit.P(t, doneStart + 0.05, doneStart + 0.85, kit.E.out),
    });
  });

  kit.drawWipeBand(ctx, t, duration, { width: w, height: h, palette: pal });
}

      function renderFrame(t) {
        const local = Math.max(0, Math.min(SHOT.duration, Number(t) || 0));
        const globalT = SHOT.start + local;
        const beatPulse = window.VibeKit.hitPulse(rhythm.beats, globalT, 0.22, rhythm.beatStrength);
        const onsetPulse = window.VibeKit.hitPulse(rhythm.onsets, globalT, 0.14, rhythm.onsetStrength);
        const beatIndex = window.VibeKit.lastAt(rhythm.beats, globalT);
        window.VibeKit.drawBackdrop(stage.ctx, globalT, { width: 1080, height: 1920, palette: stage.pal, beatPulse });
        if (typeof drawShot === 'function') {
          stage.ctx.save();
          drawShot({
            t: local,
            globalT,
            duration: SHOT.duration,
            ctx: stage.ctx,
            w: 1080,
            h: 1920,
            safe: stage.safe,
            pal: stage.pal,
            copy: SHOT.copy,
            vars: SHOT.vars,
            kit: window.VibeKit,
            motion: window.Motion,
            rhythm,
            beatPulse,
            onsetPulse,
          });
          stage.ctx.restore();
        }
        window.VibeKit.drawChrome(stage.ctx, globalT, {
          width: 1080,
          height: 1920,
          palette: stage.pal,
          series: SHOT.series,
          chapter: SHOT.chapter,
          brand: SHOT.brand,
          progress: globalT / Math.max(SHOT.filmDuration, 0.001),
          beatIndex,
          beatPulse,
        });
      }

      window.film = {
        width: 1080,
        height: 1920,
        duration: SHOT.duration,
        ready: (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(function () {
          renderFrame(0);
          return true;
        }),
        frame: function (t) {
          renderFrame(t);
        },
      };

      if (!window.filmHost) {
        const t0 = performance.now();
        const tick = function () {
          const elapsed = ((performance.now() - t0) / 1000) % SHOT.duration;
          renderFrame(elapsed);
          requestAnimationFrame(tick);
        };
        window.film.ready.then(tick);
      }
    })();
  </script>
</body>
</html>

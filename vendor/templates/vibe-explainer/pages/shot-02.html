<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, height=1920">
  <title>核心公式 · 杠杆天平</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0a0c10; }
    canvas#stage { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <canvas id="stage" width="1080" height="1920"></canvas>
  <script src="../assets/motion.js"></script>
  <script src="../assets/vibe-canvas.js"></script>
  <script>
    (function () {
      'use strict';
      const SHOT = {"id":"shot-02","title":"核心公式 · 杠杆天平","chapter":"01 · 天平隐喻","series":"VIBE 知识大赏","brand":"不加班智能团","duration":5,"filmDuration":42,"start":5,"bpm":112,"palette":{},"copy":{"num":"01","headline":"试错成本越低，容错率越暴涨","formula":"容错率 = 1 / 单次试错成本"},"vars":{}};
      const canvas = document.getElementById('stage');
      const stage = window.VibeKit.createStage(canvas, { width: 1080, height: 1920, palette: SHOT.palette });
      const rhythm = window.VibeKit.readRhythm(SHOT.filmDuration, SHOT.bpm);

      function drawShot({ t, duration, ctx, w, h, safe, pal, copy, kit }) {
  kit.drawBigNum(ctx, copy.num || '01', t, 0.05, pal.ACC, safe.left - 10, 490);

  kit.drawRiseText(ctx, copy.headline || '试错成本越低，容错率越暴涨', safe.cx, 585, 58, t, 0.25, {
    al: 'center',
    w: 800,
    col: pal.INK,
  });

  // Dynamic lever scale shifting cost from 1.0 down to 0.18
  const shiftP = kit.P(t, 1.1, 3.3, kit.E.inout);
  const cost = kit.lerp(0.95, 0.18, shiftP);
  const scaleIn = kit.P(t, 0.25, 0.8, kit.E.out);
  if (scaleIn > 0) {
    kit.drawScale(ctx, {
      palette: pal,
      cx: safe.cx,
      cy: 960,
      arm: 280,
      dropLen: 250,
      cost,
      alpha: scaleIn,
      leftLabel: '单次试错成本',
      rightLabel: '真实容错率',
    });
  }

  // Formula pill glowing at bottom
  const formP = kit.P(t, 2.7, 3.4, kit.E.back);
  if (formP > 0) {
    ctx.save();
    ctx.globalAlpha *= Math.min(1, formP * 2);
    ctx.translate(0, (1 - formP) * 50);
    kit.fillRR(ctx, safe.cx - 330, 1495, 660, 88, 44, 'rgba(79,240,176,0.12)', pal.GOOD, 3);
    kit.drawText(ctx, copy.formula || '容错率 = 1 / 单次试错成本', safe.cx, 1552, 38, {
      w: 800,
      col: pal.GOOD,
      al: 'center',
    });
    ctx.restore();
  }

  kit.drawWipeBand(ctx, t, duration, { width: w, height: h, palette: pal });
}

      function renderFrame(t) {
        const local = Math.max(0, Math.min(SHOT.duration, Number(t) || 0));
        const globalT = SHOT.start + local;
        const beatPulse = window.VibeKit.hitPulse(rhythm.beats, globalT, 0.22, rhythm.beatStrength);
        const onsetPulse = window.VibeKit.hitPulse(rhythm.onsets, globalT, 0.14, rhythm.onsetStrength);
        const beatIndex = window.VibeKit.lastAt(rhythm.beats, globalT);
        window.VibeKit.drawBackdrop(stage.ctx, globalT, { width: 1080, height: 1920, palette: stage.pal, beatPulse });
        if (typeof drawShot === 'function') {
          stage.ctx.save();
          drawShot({
            t: local,
            globalT,
            duration: SHOT.duration,
            ctx: stage.ctx,
            w: 1080,
            h: 1920,
            safe: stage.safe,
            pal: stage.pal,
            copy: SHOT.copy,
            vars: SHOT.vars,
            kit: window.VibeKit,
            motion: window.Motion,
            rhythm,
            beatPulse,
            onsetPulse,
          });
          stage.ctx.restore();
        }
        window.VibeKit.drawChrome(stage.ctx, globalT, {
          width: 1080,
          height: 1920,
          palette: stage.pal,
          series: SHOT.series,
          chapter: SHOT.chapter,
          brand: SHOT.brand,
          progress: globalT / Math.max(SHOT.filmDuration, 0.001),
          beatIndex,
          beatPulse,
        });
      }

      window.film = {
        width: 1080,
        height: 1920,
        duration: SHOT.duration,
        ready: (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(function () {
          renderFrame(0);
          return true;
        }),
        frame: function (t) {
          renderFrame(t);
        },
      };

      if (!window.filmHost) {
        const t0 = performance.now();
        const tick = function () {
          const elapsed = ((performance.now() - t0) / 1000) % SHOT.duration;
          renderFrame(elapsed);
          requestAnimationFrame(tick);
        };
        window.film.ready.then(tick);
      }
    })();
  </script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, height=1920">
  <title>物理碰撞 · 单双向门</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0a0c10; }
    canvas#stage { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <canvas id="stage" width="1080" height="1920"></canvas>
  <script src="../assets/motion.js"></script>
  <script src="../assets/vibe-canvas.js"></script>
  <script src="../assets/rhythm-data.js"></script>
  <script src="../assets/stage.js"></script>
  <script>
    (function () {
      'use strict';
      const SHOT = {"id":"shot-03","title":"物理碰撞 · 单双向门","chapter":"02 · 区分门型","series":"VIBE 知识大赏","brand":"不加班智能团","duration":6,"filmDuration":42,"start":10,"bpm":112,"palette":{},"copy":{"headline":"先分清：这是哪一扇门？","leftTitle":"单向门 · 不可逆","rightTitle":"双向门 · 随时撤退"},"vars":{}};
      const canvas = document.getElementById('stage');
      const stage = window.VibeKit.createStage(canvas, { width: 1080, height: 1920, palette: SHOT.palette });
      const rhythm = window.VibeKit.readRhythm(SHOT.filmDuration, SHOT.bpm);

      

      function renderFrame(t) {
        const local = Math.max(0, Math.min(SHOT.duration, Number(t) || 0));
        const globalT = SHOT.start + local;
        const beatPulse = window.VibeKit.hitPulse(rhythm.beats, globalT, 0.22, rhythm.beatStrength);
        const onsetPulse = window.VibeKit.hitPulse(rhythm.onsets, globalT, 0.14, rhythm.onsetStrength);
        const tonalPulse = window.VibeKit.hitPulse(rhythm.tonal || [], globalT, 0.26);
        const beatIndex = window.VibeKit.lastAt(rhythm.beats, globalT);
        window.VibeKit.drawBackdrop(stage.ctx, globalT, { width: 1080, height: 1920, palette: stage.pal, beatPulse });
        const frameCtx = {
          t: local,
          globalT,
          duration: SHOT.duration,
          filmDuration: SHOT.filmDuration,
          shot: SHOT,
          ctx: stage.ctx,
          w: 1080,
          h: 1920,
          safe: stage.safe,
          pal: stage.pal,
          copy: SHOT.copy,
          vars: SHOT.vars,
          kit: window.VibeKit,
          motion: window.Motion,
          rhythm,
          beatPulse,
          onsetPulse,
          tonalPulse,
        };
        if (typeof window.drawContinuousStage === 'function') {
          stage.ctx.save();
          window.drawContinuousStage(frameCtx);
          stage.ctx.restore();
        } else if (typeof drawShot === 'function') {
          stage.ctx.save();
          drawShot(frameCtx);
          stage.ctx.restore();
        }
        window.VibeKit.drawChrome(stage.ctx, globalT, {
          width: 1080,
          height: 1920,
          palette: stage.pal,
          series: SHOT.series,
          chapter: SHOT.chapter,
          brand: SHOT.brand,
          progress: globalT / Math.max(SHOT.filmDuration, 0.001),
          beatIndex,
          beatPulse,
        });
      }

      let manualControl = false;
      let previewRaf = 0;

      window.film = {
        width: 1080,
        height: 1920,
        duration: SHOT.duration,
        ready: (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(function () {
          renderFrame(0);
          return true;
        }),
        frame: function (t) {
          manualControl = true;
          if (previewRaf) {
            cancelAnimationFrame(previewRaf);
            previewRaf = 0;
          }
          renderFrame(t);
        },
      };

      if (!window.filmHost) {
        const t0 = performance.now();
        const tick = function () {
          if (manualControl) return;
          const elapsed = ((performance.now() - t0) / 1000) % SHOT.duration;
          renderFrame(elapsed);
          previewRaf = requestAnimationFrame(tick);
        };
        window.film.ready.then(function () {
          if (!manualControl) previewRaf = requestAnimationFrame(tick);
        });
      }
    })();
  </script>
</body>
</html>

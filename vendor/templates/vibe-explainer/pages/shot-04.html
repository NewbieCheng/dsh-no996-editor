<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, height=1920">
  <title>拆解重构 · 大块裂解</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0a0c10; }
    canvas#stage { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <canvas id="stage" width="1080" height="1920"></canvas>
  <script src="../assets/motion.js"></script>
  <script src="../assets/vibe-canvas.js"></script>
  <script>
    (function () {
      'use strict';
      const SHOT = {"id":"shot-04","title":"拆解重构 · 大块裂解","chapter":"03 · 切成小块","series":"VIBE 知识大赏","brand":"不加班智能团","duration":5.5,"filmDuration":42,"start":16,"bpm":112,"palette":{},"copy":{"num":"02","headline":"哪怕真的是单向门，也要学会拆碎","whole":"3 个月 · 整个方向 · 一次押满","focus":"先只做这 1 块 · 2 周验证"},"vars":{}};
      const canvas = document.getElementById('stage');
      const stage = window.VibeKit.createStage(canvas, { width: 1080, height: 1920, palette: SHOT.palette });
      const rhythm = window.VibeKit.readRhythm(SHOT.filmDuration, SHOT.bpm);

      function drawShot({ t, duration, ctx, w, h, safe, pal, copy, kit, motion }) {
  const crackShake = motion.shake(t, 1.55, { amp: 12, freq: 85, decay: 16 });
  ctx.save();
  ctx.translate(crackShake, crackShake * 0.4);

  kit.drawBigNum(ctx, copy.num || '02', t, 0.05, pal.ACC, safe.left - 10, 465);

  kit.drawRiseText(ctx, copy.headline || '哪怕真的是单向门，也要学会拆碎', safe.cx, 560, 52, t, 0.2, {
    al: 'center',
    w: 800,
    col: pal.INK,
  });

  const enter = kit.P(t, 0.25, 0.85, kit.E.out);
  const split = kit.P(t, 1.5, 2.3, kit.E.out);
  const fall = kit.P(t, 2.55, 3.6, kit.E.inn);
  const pick = kit.P(t, 3.55, 4.45, kit.E.back);

  kit.drawSplitBar(ctx, {
    palette: pal,
    x: safe.left,
    y: 670,
    width: safe.span,
    height: 180,
    count: 6,
    enter,
    split,
    fall,
    pick,
    wholeText: copy.whole || '3 个月 · 整个方向 · 一次押满',
    focusText: copy.focus || '先只做这 1 块 · 2 周验证',
    pieceText: '2周',
  });

  // Dashed stop-loss cutoff line animating beneath
  const lineP = kit.P(t, 2.9, 3.8, kit.E.out);
  if (lineP > 0) {
    ctx.save();
    ctx.globalAlpha *= lineP;
    ctx.setLineDash([18, 12]);
    kit.line(ctx, safe.left, 1080, kit.lerp(safe.left, safe.right, lineP), 1080, pal.ACC, 4);
    ctx.setLineDash([]);
    kit.drawText(ctx, '▲ 止损线：哪怕验证失败，也只赔掉 16% 时间', safe.cx, 1145, 34, {
      w: 700,
      col: pal.ACC,
      al: 'center',
    });
    ctx.restore();
  }

  ctx.restore();
  kit.drawWipeBand(ctx, t, duration, { width: w, height: h, palette: pal });
}

      function renderFrame(t) {
        const local = Math.max(0, Math.min(SHOT.duration, Number(t) || 0));
        const globalT = SHOT.start + local;
        const beatPulse = window.VibeKit.hitPulse(rhythm.beats, globalT, 0.22, rhythm.beatStrength);
        const onsetPulse = window.VibeKit.hitPulse(rhythm.onsets, globalT, 0.14, rhythm.onsetStrength);
        const beatIndex = window.VibeKit.lastAt(rhythm.beats, globalT);
        window.VibeKit.drawBackdrop(stage.ctx, globalT, { width: 1080, height: 1920, palette: stage.pal, beatPulse });
        if (typeof drawShot === 'function') {
          stage.ctx.save();
          drawShot({
            t: local,
            globalT,
            duration: SHOT.duration,
            ctx: stage.ctx,
            w: 1080,
            h: 1920,
            safe: stage.safe,
            pal: stage.pal,
            copy: SHOT.copy,
            vars: SHOT.vars,
            kit: window.VibeKit,
            motion: window.Motion,
            rhythm,
            beatPulse,
            onsetPulse,
          });
          stage.ctx.restore();
        }
        window.VibeKit.drawChrome(stage.ctx, globalT, {
          width: 1080,
          height: 1920,
          palette: stage.pal,
          series: SHOT.series,
          chapter: SHOT.chapter,
          brand: SHOT.brand,
          progress: globalT / Math.max(SHOT.filmDuration, 0.001),
          beatIndex,
          beatPulse,
        });
      }

      window.film = {
        width: 1080,
        height: 1920,
        duration: SHOT.duration,
        ready: (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(function () {
          renderFrame(0);
          return true;
        }),
        frame: function (t) {
          renderFrame(t);
        },
      };

      if (!window.filmHost) {
        const t0 = performance.now();
        const tick = function () {
          const elapsed = ((performance.now() - t0) / 1000) % SHOT.duration;
          renderFrame(elapsed);
          requestAnimationFrame(tick);
        };
        window.film.ready.then(tick);
      }
    })();
  </script>
</body>
</html>

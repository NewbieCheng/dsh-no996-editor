<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, height=1920">
  <title>沙盘推演 · 96格收敛</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0a0c10; }
    canvas#stage { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <canvas id="stage" width="1080" height="1920"></canvas>
  <script src="../assets/motion.js"></script>
  <script src="../assets/vibe-canvas.js"></script>
  <script>
    (function () {
      'use strict';
      const SHOT = {"id":"shot-06","title":"沙盘推演 · 96格收敛","chapter":"05 · 低成本预演","series":"VIBE 知识大赏","brand":"不加班智能团","duration":5.5,"filmDuration":42,"start":27,"bpm":112,"palette":{},"copy":{"headline":"把 96 次错，留在动手之前"},"vars":{}};
      const canvas = document.getElementById('stage');
      const stage = window.VibeKit.createStage(canvas, { width: 1080, height: 1920, palette: SHOT.palette });
      const rhythm = window.VibeKit.readRhythm(SHOT.filmDuration, SHOT.bpm);

      function drawShot({ t, duration, ctx, w, h, safe, pal, copy, kit }) {
  kit.drawRiseText(ctx, copy.headline || '把 96 次错，留在动手之前', safe.cx, 410, 62, t, 0.15, {
    al: 'center',
    w: 800,
    col: pal.INK,
  });

  // Deterministic 96-cell grid schedule over [0.45, 2.75]
  const total = 96;
  const times = [];
  const order = [];
  const used = new Array(total).fill(false);
  for (let i = 0; i < total; i += 1) {
    times.push(0.45 + (i / total) * 2.25);
    let idx = Math.floor(kit.det(i, 7, 19) * total);
    while (used[idx]) idx = (idx + 1) % total;
    used[idx] = true;
    order.push(idx);
  }

  const collapse = kit.P(t, 3.0, 3.9, kit.E.inout);
  const shown = kit.drawSimGrid(ctx, {
    palette: pal,
    x: 112,
    y: 590,
    cell: 64,
    gap: 8,
    cols: 12,
    rows: 8,
    times,
    order,
    keepIndex: 41,
    collapse,
    t,
    targetX: safe.cx,
    targetY: 920,
  });

  // Winning emerald node emerges cleanly at center as grid collapses
  const winP = kit.P(t, 3.25, 4.15, kit.E.back);
  if (winP > 0) {
    ctx.save();
    ctx.translate(safe.cx, 920);
    ctx.scale(winP, winP);
    ctx.shadowColor = pal.GOOD;
    ctx.shadowBlur = 40;
    kit.circ(ctx, 0, 0, 96, 'rgba(79,240,176,0.18)', pal.GOOD, 6);
    ctx.shadowBlur = 0;
    kit.drawCheck(ctx, 0, 4, 92, kit.P(t, 3.45, 4.15), pal.GOOD, 14);
    ctx.restore();
  }

  // Live simulation counter / summary card
  const summaryText = collapse > 0.6
    ? '真实世界：1 次命中 · 沙盘推演：96 次排雷'
    : `已完成低成本预演：${shown} / 96 次边界测试`;
  kit.fillRR(ctx, safe.left + 30, 1290, safe.span - 60, 140, 26, pal.CARD, collapse > 0.6 ? pal.GOOD : pal.ACC, 3);
  kit.drawText(ctx, summaryText, safe.cx, 1372, 36, {
    w: 700,
    col: collapse > 0.6 ? pal.GOOD : pal.ACC,
    al: 'center',
  });

  kit.drawWipeBand(ctx, t, duration, { width: w, height: h, palette: pal });
}

      function renderFrame(t) {
        const local = Math.max(0, Math.min(SHOT.duration, Number(t) || 0));
        const globalT = SHOT.start + local;
        const beatPulse = window.VibeKit.hitPulse(rhythm.beats, globalT, 0.22, rhythm.beatStrength);
        const onsetPulse = window.VibeKit.hitPulse(rhythm.onsets, globalT, 0.14, rhythm.onsetStrength);
        const beatIndex = window.VibeKit.lastAt(rhythm.beats, globalT);
        window.VibeKit.drawBackdrop(stage.ctx, globalT, { width: 1080, height: 1920, palette: stage.pal, beatPulse });
        if (typeof drawShot === 'function') {
          stage.ctx.save();
          drawShot({
            t: local,
            globalT,
            duration: SHOT.duration,
            ctx: stage.ctx,
            w: 1080,
            h: 1920,
            safe: stage.safe,
            pal: stage.pal,
            copy: SHOT.copy,
            vars: SHOT.vars,
            kit: window.VibeKit,
            motion: window.Motion,
            rhythm,
            beatPulse,
            onsetPulse,
          });
          stage.ctx.restore();
        }
        window.VibeKit.drawChrome(stage.ctx, globalT, {
          width: 1080,
          height: 1920,
          palette: stage.pal,
          series: SHOT.series,
          chapter: SHOT.chapter,
          brand: SHOT.brand,
          progress: globalT / Math.max(SHOT.filmDuration, 0.001),
          beatIndex,
          beatPulse,
        });
      }

      window.film = {
        width: 1080,
        height: 1920,
        duration: SHOT.duration,
        ready: (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(function () {
          renderFrame(0);
          return true;
        }),
        frame: function (t) {
          renderFrame(t);
        },
      };

      if (!window.filmHost) {
        const t0 = performance.now();
        const tick = function () {
          const elapsed = ((performance.now() - t0) / 1000) % SHOT.duration;
          renderFrame(elapsed);
          requestAnimationFrame(tick);
        };
        window.film.ready.then(tick);
      }
    })();
  </script>
</body>
</html>
